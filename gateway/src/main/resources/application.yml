server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
          routes:
            - id: usuarios-auth
              uri: ${AUTH_URL:http://localhost:8081}
              predicates:
                - Path=/auth/**,/users/**
            - id: catalogo-productos
              uri: ${CATALOGO_URL:http://localhost:8082}
              predicates:
                - Path=/products/**
            - id: pedidos
              uri: ${PEDIDOS_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/cart/**,/api/v1/orders/**,/api/v1/payments/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "http://localhost:5173"
                allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
                allowedHeaders: "*"

jwt:
  secret: ${JWT_SECRET:powernut-clave-desarrollo-minimo-32-caracteres-2026}