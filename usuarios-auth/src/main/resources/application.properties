spring.application.name=usuarios-auth
server.port=8081

# Base de datos H2 en memoria (desarrollo)
spring.datasource.url=jdbc:h2:mem:powernut
spring.datasource.username=sa
spring.datasource.password=

# JPA: crea las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola web de H2 para ver las tablas
spring.h2.console.enabled=true

# JWT: la clave se lee de la variable de entorno JWT_SECRET; el valor tras ":" es solo para desarrollo
jwt.secret=${JWT_SECRET:powernut-clave-desarrollo-minimo-32-caracteres-2026}
jwt.expiration-ms=900000